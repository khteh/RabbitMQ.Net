version: 2.1
references:
  workspace_root: &workspace_root ~/workspace

  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

defaults: &defaults # Default directory to run the steps in.
  working_directory: *workspace_root

jobs:
  build_and_test:
    <<: *defaults
    docker:
      - image: khteh/circleci-dotnet:latest
    steps:
      - checkout:
          method: full
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore /p:Version=10.0 --version-suffix $CIRCLE_BUILD_NUM
      #- run: dotnet test -c Release --no-restore --no-build test/CinemaReservation.Tests
      - run: dotnet publish -c Release /p:Version=10.0 --version-suffix $CIRCLE_BUILD_NUM -a x64 --os linux src/RabbitMQ.Publisher
      - run: dotnet publish -c Release /p:Version=10.0 --version-suffix $CIRCLE_BUILD_NUM -a x64 --os linux src/RabbitMQ.Subscriber
      - setup_remote_docker:
          docker_layer_caching: true
      # use a primary image that already has Docker (recommended)
      # or install it during a build like we do here
      - run:
          name: Extract FileVersion from published binary
          command: |
            exiftool src/RabbitMQ.Publisher/bin/Release/net10.0/linux-x64/publish/RabbitMQ.Publisher.dll | grep "File Version" | awk -F":" '{ print $2 }' | xargs echo -n > publisher_version.txt
            exiftool src/RabbitMQ.Subscriber/bin/Release/net10.0/linux-x64/publish/RabbitMQ.Subscriber.dll | grep "File Version" | awk -F":" '{ print $2 }' | xargs echo -n > subscriber_version.txt
      - run:
          name: Build Publisher docker image
          command: |
            MAJOR=$(cat publisher_version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat publisher_version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            docker build -t khteh/rabbitmq-publisher:latest -t khteh/rabbitmq-publisher:$VERSION src/RabbitMQ.Publisher
      - run:
          name: Build Subscriber docker image
          command: |
            MAJOR=$(cat subscriber_version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat subscriber_version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            docker build -t khteh/rabbitmq-subscriber:latest -t khteh/rabbitmq-subscriber:$VERSION src/RabbitMQ.Subscriber
      - run:
          name: Login to docker hub
          command: docker login -u $DOCKER_USER -p $DOCKER_PASS
      - run:
          name: Push Publisher images to docker hub
          command: |
            MAJOR=$(cat publisher_version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat publisher_version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            echo ${VERSION} > docker-build_number.txt
            docker push khteh/rabbitmq-publisher --all-tags
      - run:
          name: Push Subscriber images to docker hub
          command: |
            MAJOR=$(cat subscriber_version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat subscriber_version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            docker push khteh/rabbitmq-subscriber --all-tags
      - persist_to_workspace:
          name: Save Workspace
          root: .
          paths:
            - docker-build_number.txt
  deploy-eks:
    <<: *defaults
    docker:
      - image: khteh/ubuntu:latest
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Use the saved build number here
          command: |
            echo 'export CIRCLE_BUILD_NUM_DOCKER="$(cat /tmp/docker-build_number.txt)"' >> $BASH_ENV
            . $BASH_ENV
            echo CIRCLE_BUILD_NUM_DOCKER: $CIRCLE_BUILD_NUM_DOCKER
      - run:
          name: Set Default AWS Region
          command: aws configure set default.region $AWS_REGION
      - run:
          name: Set AWS Access Key
          command: aws configure set aws_access_key_id $AWS_ACCESS_KEY
      - run:
          name: Set AWS Secret Key
          command: aws configure set aws_secret_access_key $AWS_SECRET_KEY
      - run:
          name: Update Kubectl Configuration with cluster name
          command: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME
      - run:
          name: Update Application
          command: |
            kubectl patch statefulset cinema-reservation --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/image", "value":"'$AWS_ACCOUNT_ID'.dkr.ecr.ap-southeast-1.amazonaws.com/cinema-reservation:'$CIRCLE_BUILD_NUM_DOCKER'"}]'
workflows:
  main:
    jobs:
      - build_and_test
